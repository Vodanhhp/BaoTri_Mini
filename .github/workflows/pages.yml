name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: 'https://dskeaiyvldiwlsfqkboq.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRza2VhaXl2bGRpd2xzZnFrYm9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMTAyNDIsImV4cCI6MjExMDc4NjI0Mn0.-P7U_dmIhEgzELouhmIyPmkHT6qhOGdQGvFJeiIYhe4'
      - name: Verify Supabase client configuration is embedded
        run: |
          test -s dist/index.html
          grep -R -F -q "$VITE_SUPABASE_URL" dist/assets
          grep -R -F -q "$VITE_SUPABASE_PUBLISHABLE_KEY" dist/assets
        env:
          VITE_SUPABASE_URL: 'https://dskeaiyvldiwlsfqkboq.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRza2VhaXl2bGRpd2xzZnFrYm9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMTAyNDIsImV4cCI6MjExMDc4NjI0Mn0.-P7U_dmIhEgzELouhmIyPmkHT6qhOGdQGvFJeiIYhe4'
      - name: Preserve custom domain
        run: cp CNAME dist/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
